<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14254a">
  <meta name="description" content="The personal portfolio of Chadrick Liang — software development, experiments, and selected projects, collected in a blue-and-gold book.">
  <title>Chadrick Liang — An Introduction</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="font/TrajanPro-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/gold_shift.css">
  <link rel="stylesheet" href="css/style.css">
  <script src="extras/jquery.min.1.7.js" defer></script>
  <script src="lib/turn.js" defer></script>
  <script src="extras/app.js" defer></script>
</head>
<body>
  <aside id="rotate-overlay" role="status" aria-label="Landscape orientation required">
    <span class="rotate-symbol" aria-hidden="true">↻</span>
    <p class="rotate-title">A little more room to read.</p>
    <p>Please rotate your device to landscape for the best experience.</p>
  </aside>
  <a class="skip-link" href="#book">Skip to the book</a>
  <header class="site-header">
    <div class="header-ribbon">
    <a class="identity" href="#cover" data-page="1" aria-label="Chadrick Liang, front cover"><span class="identity-mark" aria-hidden="true">CL</span><span>Chadrick Liang<span class="identity-caption">A personal portfolio</span></span></a>
    <nav class="chapter-nav" aria-label="Chapters">
      <a href="#welcome" data-page="3">Welcome</a>
      <a href="#about" data-page="4">About</a>
      <a href="#im-connected" data-page="6">Projects</a>
      <a href="#toolkit" data-page="14">Toolkit</a>
      <a href="#contact" data-page="17">Contact</a>
    </nav>
    </div>
  </header>

  <main id="main">
    <div class="book-stage">
      <div class="book-shell">
        <div class="book" id="book" tabindex="-1" role="region" aria-label="An Introduction, an interactive portfolio book">
          <!-- extras/app.js loads pages/page1.html through page18.html here. -->
        </div>
      </div>
    </div>
    <nav class="reader-controls" aria-label="Book controls"><button id="previous" aria-label="Previous page" disabled><span aria-hidden="true">←</span><span class="control-word">Previous</span></button><div class="reader-position"><p id="position-label">Front cover</p><div class="progress-track" aria-hidden="true"><span id="reading-progress"></span></div></div><button id="next" aria-label="Open the book"><span class="control-word" id="next-label">Open the book</span><span aria-hidden="true">→</span></button></nav>
    <p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
    <p id="book-status" class="noscript-message" role="status">Enable JavaScript to open the book.</p>
    <p id="retry-book" class="noscript-message" hidden><a href="">Try again</a></p>
  </main>
  <dialog id="image-dialog" aria-label="Image viewer">
    <div class="dialog-toolbar">
      <div class="viewer-zoom-controls">
        <button id="zoom-out" type="button" aria-label="Zoom out"><span aria-hidden="true">&#8722;</span></button>
        <button id="zoom-in" type="button" aria-label="Zoom in"><span aria-hidden="true">+</span></button>
        <button id="zoom-fit" type="button" aria-label="Fit image to viewer"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
      </div>
      <button id="close-dialog" aria-label="Close image viewer" type="button"><span aria-hidden="true">&#215;</span></button>
    </div>
    <div class="dialog-image-scroll" tabindex="0" role="region" aria-label="Image area; use zoom controls and scroll or drag to explore"><div class="image-canvas"><img id="enlarged-image" alt="" draggable="false"></div></div>
  </dialog>
</body>
</html>
